name: Generate snake animation

on:
  schedule:
    - cron: "0 15 * * *" # every day at 00:00 KST
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#ff9ecb&color_dots=#1c1740,#3b2b7a,#5a3fb0,#8a66e0,#b79cff
            dist/snake-light.svg?color_snake=#5a3fb0&color_dots=#ece8ff,#cdbfff,#a58cf5,#7a5cd6,#5a3fb0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
